const CHAPTERS = ['The Network Layer','The Transport Layer','The Application Layer'];
const DESCRIPTIONS = ['IPv4, subnetting, VLSM, routing, and ICMP.','TCP, UDP, ports, reliability, and flow control.','Web, email, DHCP, DNS, and file transfer.'];
const CHAPTER_NUMBERS = [5,6,7];
const TOTAL = QUESTIONS.length;
const KEY='protocol-lab-chapters-5-7-attempt-v1';
const byId = Object.fromEntries(QUESTIONS.map(q=>[q.id,q]));
const app=document.getElementById('app');

let filter='mistakes';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a,random=Math.random){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fresh(previous){let order=shuffle(QUESTIONS.map(q=>q.id));if(previous&&order.every((id,i)=>id===previous[i]))order.push(order.shift());return {order,choices:Object.fromEntries(QUESTIONS.map(q=>[q.id,shuffle([0,1,2,3])])),answers:{},flags:[],current:0,finished:false};}
function readState(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s||s.order?.length!==TOTAL||new Set(s.order).size!==TOTAL||!s.order.every(id=>byId[id])||!Number.isInteger(s.current)||s.current<0||s.current>=TOTAL||typeof s.answers!=='object'||s.answers===null||!Array.isArray(s.flags)||typeof s.finished!=='boolean')return null;for(const q of QUESTIONS){const c=s.choices?.[q.id];if(!Array.isArray(c)||c.length!==4||new Set(c).size!==4||!c.every(n=>Number.isInteger(n)&&n>=0&&n<4))return null;const a=s.answers[q.id];if(a!==undefined&&(!Number.isInteger(a)||a<0||a>3))return null;}return s;}catch{return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saveStatus').textContent='Browser progress saved';}catch{document.getElementById('saveStatus').textContent='Progress saved for this tab only';}}
function countAnswered(s=state){return s?QUESTIONS.filter(q=>s.answers[q.id]!==undefined).length:0;}
function grade(s){const chapters=CHAPTERS.map((name,i)=>({name,total:20,correct:QUESTIONS.filter(q=>q.chapter===CHAPTER_NUMBERS[i]&&s.answers[q.id]===q.answer).length,answered:QUESTIONS.filter(q=>q.chapter===CHAPTER_NUMBERS[i]&&s.answers[q.id]!==undefined).length}));return {score:chapters.reduce((n,c)=>n+c.correct,0),chapters,missed:QUESTIONS.filter(q=>s.answers[q.id]!==q.answer)};}

function quiz(){const q=byId[state.order[state.current]],answered=countAnswered(),flagged=state.flags.includes(q.id);return `<div class="workspace"><aside class="sidebar"><span class="eyebrow">YOUR STUDY SESSION</span><h3>Three chapters. One goal.</h3>${CHAPTERS.map((n,i)=>{const count=QUESTIONS.filter(q=>q.chapter===CHAPTER_NUMBERS[i]&&state.answers[q.id]!==undefined).length;return `<div class="chapter-progress"><div class="row"><span>${CHAPTER_NUMBERS[i]} ${n}</span><span>${count}/20</span></div><div class="bar"><i style="width:${count*5}%"></i></div></div>`;}).join('')}<details class="navigator" open><summary>Question navigator</summary><div class="grid">${state.order.map((id,i)=>`<button data-jump="${i}" class="${state.answers[id]!==undefined?'answered ':''}${i===state.current?'current ':''}${state.flags.includes(id)?'flag':''}" aria-label="Question ${i+1}${state.answers[id]!==undefined?', answered':', unanswered'}${state.flags.includes(id)?', flagged':''}" ${i===state.current?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><p class="legend">Green = answered · Orange dot = flagged<br>Select any number to revisit.</p></details></aside><section><div class="quiz-head"><div><span class="eyebrow">PRACTICE / CHAPTERS 5–7</span><h1>Make the connection.</h1></div><span class="counter">${answered} / ${TOTAL} answered</span></div><div class="progress" role="progressbar" aria-label="Questions answered" aria-valuenow="${answered}" aria-valuemin="0" aria-valuemax="${TOTAL}"><i style="width:${answered/TOTAL*100}%"></i></div><article class="question-card"><div class="question-meta"><span class="pill">CH ${q.chapter} · ${CHAPTERS[CHAPTER_NUMBERS.indexOf(q.chapter)]}</span><button class="flag-button ${flagged?'active':''}" data-action="flag" aria-pressed="${flagged}">${flagged?'⚑ Flagged':'⚐ Flag for review'}</button></div><span class="eyebrow">QUESTION ${String(state.current+1).padStart(2,'0')} / ${TOTAL}</span><h2 id="questionText" style="margin-top:12px">${esc(q.q)}</h2><div class="options" role="radiogroup" aria-labelledby="questionText">${state.choices[q.id].map((o,i)=>`<label class="option ${state.answers[q.id]===o?'selected':''}"><input type="radio" name="answer" value="${o}" ${state.answers[q.id]===o?'checked':''}><span class="letter" aria-hidden="true">${'ABCD'[i]}</span><span class="option-text">${esc(q.options[o])}</span></label>`).join('')}</div></article><div class="quiz-bottom"><button class="secondary" data-action="previous" ${state.current===0?'disabled':''}>← Previous</button><div class="right"><button class="secondary" data-action="finish">Finish quiz</button>${state.current<TOTAL-1?'<button class="primary" data-action="next">Next <span>→</span></button>':''}</div></div><p class="sub-note">Choose one answer. You can change it anytime before finishing.</p></section></div>`;}
function results(){const g=grade(state),pct=Math.round(g.score/TOTAL*100);const visible=state.order.map(id=>byId[id]).filter(q=>filter==='all'||(filter==='mistakes'?state.answers[q.id]!==q.answer:q.chapter===Number(filter)));return `<div class="result-heading"><div><span class="eyebrow">ATTEMPT COMPLETE / YOUR RESULTS</span><h1>${g.score===TOTAL?'Every connection made.':g.score>=TOTAL*0.8?'Your knowledge is connecting.':'Every attempt builds understanding.'}</h1><p>${g.score===TOTAL?'Perfect score. Try a new order to reinforce what you know.':'Review the explanations below, then try a fresh shuffle.'}</p></div><button class="primary" data-action="new">Restart & shuffle ↻</button></div><section class="score-layout"><div class="score-card"><span class="eyebrow">YOUR TOTAL SCORE</span><div class="score-num">${g.score}<span> / ${TOTAL}</span></div><p>${pct}% correct · ${countAnswered()} answered · ${TOTAL-countAnswered()} unanswered</p></div><div class="breakdown"><span class="eyebrow" style="display:block;margin-bottom:18px">CHAPTER BREAKDOWN</span>${g.chapters.map((c,i)=>`<div class="chapter-progress"><div class="row"><span>${CHAPTER_NUMBERS[i]} ${c.name}</span><strong>${c.correct} / 20</strong></div><div class="bar"><i style="width:${c.correct*5}%"></i></div></div>`).join('')}</div></section><div class="section-line"><h2 style="font-size:23px;margin:0">Your answer review</h2><span>${g.missed.length} to revisit · No negative marking</span></div><div class="review-controls" role="group" aria-label="Filter answer review">${[['mistakes',`Mistakes (${g.missed.length})`],['all','All answers'],...CHAPTERS.map((n,i)=>[String(CHAPTER_NUMBERS[i]),`Chapter ${CHAPTER_NUMBERS[i]}`])].map(([v,l])=>`<button class="filter ${filter===v?'active':''}" data-filter="${v}" aria-pressed="${filter===v}">${l}</button>`).join('')}</div><div id="reviewList">${visible.length?visible.map(q=>review(q)).join(''):'<div class="empty">No mistakes. You answered all 60 questions correctly!</div>'}</div>`;}
function review(q){const a=state.answers[q.id],correct=a===q.answer,pos=state.order.indexOf(q.id)+1;return `<details class="review-item ${correct?'correct':''}" ${filter==='mistakes'?'open':''}><summary><span class="status-dot" aria-hidden="true">${correct?'✓':'×'}</span><span class="review-title">${esc(q.q)}<small>Question ${pos} · Chapter ${q.chapter} · ${correct?'Correct':a===undefined?'Unanswered':'Incorrect'}</small></span><span class="review-toggle" aria-hidden="true">⌄</span></summary><div class="review-body"><div class="answer-line ${correct?'correct-text':'wrong-text'}"><b>Your answer:</b> ${a===undefined?'Not answered':esc(q.options[a])}</div>${!correct?`<div class="answer-line correct-text"><b>Correct answer:</b> ${esc(q.options[q.answer])}</div>`:''}<div class="explanation"><b>Why this is correct</b><br>${esc(q.explanation)}<br><small>Course PDF · page ${q.sourcePage}</small></div></div></details>`;}
async function confirmAction(title,body,label){const d=document.getElementById('confirm');document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogBody').textContent=body;document.getElementById('dialogOK').textContent=label;d.returnValue='';d.showModal();return new Promise(resolve=>d.addEventListener('close',()=>resolve(d.returnValue==='ok'),{once:true}));}
async function start(){if(state&&!state.finished&&!await confirmAction('Start a fresh attempt?',`Your current ${countAnswered()} answers will be cleared. All ${TOTAL} questions and their answer choices will be shuffled.`,'Restart & shuffle'))return;state=fresh(state?.order);screen='quiz';filter='mistakes';save();render(true);announce('New shuffled attempt started.');}
async function finish(){const n=TOTAL-countAnswered();if(!await confirmAction(n?`${n} question${n===1?' is':'s are'} unanswered`:'Ready to see your score?',n?'Unanswered questions receive zero points. You can return to them now, or finish and review your results.':'Your answers will be marked, and you can review explanations for every question.','Finish & see score'))return;state.finished=true;screen='results';filter='mistakes';save();render(true);announce(`Quiz complete. Your score is ${grade(state).score} out of ${TOTAL}.`);}
function bind(){app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{state.current=Number(b.dataset.jump);save();render(true);});app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();app.querySelector(`[data-filter="${filter}"]`).focus();});app.querySelectorAll('input[name="answer"]').forEach(input=>input.onchange=()=>{state.answers[state.order[state.current]]=Number(input.value);save();const value=input.value;render();app.querySelector(`input[value="${value}"]`).focus({preventScroll:true});announce(`Answer saved. ${countAnswered()} of ${TOTAL} answered.`);});}
function action(a){if(a==='new')start();if(a==='resume'){screen='quiz';render(true);}if(a==='results'){screen='results';render(true);}if(a==='next'||a==='previous'){state.current=Math.max(0,Math.min(TOTAL-1,state.current+(a==='next'?1:-1)));save();render(true);}if(a==='flag'){const id=state.order[state.current];state.flags=state.flags.includes(id)?state.flags.filter(x=>x!==id):[...state.flags,id];save();render();app.querySelector('[data-action="flag"]').focus();}if(a==='finish')finish();}
document.getElementById('restartTop').onclick=start;
document.getElementById('brand').onclick=e=>{e.preventDefault();screen='home';render(true);};
render();
</script>

</style>
<script>
// Chapters 5–7 learning extension. Inlined into the standalone quiz for offline use.
const LEARNING_KEY = KEY + '-learning-v1';
function loadLearning() {
  try {
    const s = JSON.parse(localStorage.getItem(LEARNING_KEY));
    if (!s || s.version !== 1) return null;
    if (s.session) {
      const t = s.session;
      if (!['practice', 'challenge'].includes(t.kind) || !Array.isArray(t.queue) || !t.queue.length ||
          !Number.isInteger(t.current) || t.current < 0 || t.current >= t.queue.length ||
          !Number.isInteger(t.correct) || t.correct < 0 || !t.streaks || typeof t.streaks !== 'object' ||
          !Array.isArray(t.missed) || !t.queue.every(id => t.kind === 'practice' ? byId[id] : CHALLENGES.some(q => q.id === id))) s.session = null;
    }
    return s;
  } catch { return null; }
}
const CHALLENGES = [
  {id:'n1',chapter:5,q:'A subnet uses /26. How many conventional usable IPv4 host addresses does it provide?',a:['62'],why:'32 − 26 = 6 host bits. 2^6 − 2 = 62 usable addresses.'},
  {id:'n2',chapter:5,q:'What is the network address of 192.168.8.150/26? Enter the full IPv4 address.',a:['192.168.8.128'],why:'/26 blocks begin at 0, 64, 128, and 192. Address .150 belongs to the .128–.191 block.'},
  {id:'n3',chapter:5,q:'What is the broadcast address of 192.168.8.64/27? Enter the full IPv4 address.',a:['192.168.8.95'],why:'A /27 contains 32 addresses: .64 through .95. The last address is the broadcast address.'},
  {id:'n4',chapter:5,q:'A department needs 50 usable host addresses. Enter the longest prefix (smallest subnet) that fits, such as /24.',a:['/26','26'],why:'/27 gives only 30 usable hosts. /26 gives 62, so it is the smallest conventional subnet that fits.'},
  {id:'n5',chapter:5,q:'Allocate VLSM subnets largest first from 192.168.4.0/24: 50 hosts, then 20 hosts. The first gets .0/26. What network address starts the second subnet?',a:['192.168.4.64','192.168.4.64/27'],why:'The /26 uses .0–.63. The next available /27 begins at .64 and supports 30 usable hosts.'},
  {id:'t1',chapter:6,q:'TCP has received all bytes 1 through 900 in order. What acknowledgment number does it send?',a:['901','ack 901','ack901'],why:'The acknowledgment number identifies the next byte expected: 901.'},
  {id:'t2',chapter:6,q:'TCP receives bytes 1–100 and 201–300, but bytes 101–200 are missing. What acknowledgment number does it send?',a:['101','ack 101','ack101'],why:'The cumulative acknowledgment stays at the first missing byte, 101, even when later bytes arrive.'},
  {id:'t3',chapter:6,q:'Which TCP header field advertises how many bytes the receiver can currently accept?',a:['window','window size','receive window','receiver window','advertised window','tcp window','tcp window size'],why:'The receive window communicates available receiving capacity. The acknowledgment number identifies a byte position.'},
  {id:'t4',chapter:6,q:'A client sends SYN to open a TCP connection. Which flags should the server normally send in response?',a:['syn ack','syn-ack','synack','syn + ack','syn/ack','syn, ack'],why:'TCP setup is SYN → SYN-ACK → ACK.'},
  {id:'t5',chapter:6,q:'How many bytes are in a UDP header? Enter a number.',a:['8','8 bytes'],why:'Four 16-bit fields total 64 bits, or 8 bytes. UDP length includes both the header and data.'},
  {id:'a1',chapter:7,q:'A laptop already has valid IP settings. Which service resolves a website name to an IP address?',a:['dns','domain name system','domain name service'],why:'DNS resolves names. DHCP supplies network configuration; it does not perform website name resolution.'},
  {id:'a2',chapter:7,q:'You want mailbox changes to synchronize between your phone and laptop. Which email protocol fits?',a:['imap'],why:'IMAP maintains a server-based mailbox and synchronizes changes. SMTP sends mail; POP3 focuses on retrieval.'},
  {id:'a3',chapter:7,q:'Which HTTP method is commonly used to submit a completed web form?',a:['post','http post'],why:'POST submits data for processing. GET requests a resource.'},
  {id:'a4',chapter:7,q:'A DHCP client has received an Offer and wants to accept it. Which message does the client send next?',a:['request','dhcprequest','dhcp request'],why:'Discover → Offer → Request → ACK. The client requests; the server acknowledges.'},
  {id:'a5',chapter:7,q:'An FTP client sends commands over its control connection. Which TCP destination port does it use?',a:['21','tcp 21','port 21'],why:'FTP control uses TCP 21. File data uses a separate connection.'}
];
let learning = loadLearning() || {version:1,aced:false,passedAt:0,session:null};
function makeChallengeSet() {
  const set=CHALLENGES.map(q=>({...q,a:[...q.a]}));
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const third=pick([12,24,36,48,60,72,84,96]);
  const prefix=pick([25,26,27,28]), hosts=2**(32-prefix)-2;
  Object.assign(set[0],{q:`A subnet uses /${prefix}. How many conventional usable IPv4 host addresses does it provide?`,a:[String(hosts)],why:`32 − ${prefix} = ${32-prefix} host bits. 2^${32-prefix} − 2 = ${hosts} usable addresses.`});
  const block=pick([0,64,128,192]), host=block+pick([10,20,30,40,50]);
  Object.assign(set[1],{q:`What is the network address of 192.168.${third}.${host}/26? Enter the full IPv4 address.`,a:[`192.168.${third}.${block}`],why:`/26 blocks contain 64 addresses. This block runs from .${block} through .${block+63}; its network address is .${block}.`});
  const start=pick([0,32,64,96,128,160,192,224]);
  Object.assign(set[2],{q:`What is the broadcast address of 192.168.${third}.${start}/27? Enter the full IPv4 address.`,a:[`192.168.${third}.${start+31}`],why:`A /27 contains 32 addresses. This block runs from .${start} through .${start+31}; the last address is the broadcast address.`});
  const need=pick([{n:12,p:28},{n:25,p:27},{n:50,p:26},{n:100,p:25}]);
  Object.assign(set[3],{q:`A department needs ${need.n} usable host addresses. Enter the longest prefix (smallest subnet) that fits, such as /24.`,a:[`/${need.p}`,String(need.p)],why:`/${need.p} supplies ${2**(32-need.p)-2} usable hosts. The next smaller subnet (/${need.p+1}) supplies only ${2**(31-need.p)-2}, which is insufficient.`});
  Object.assign(set[4],{q:`Allocate VLSM subnets largest first from 192.168.${third}.0/24: 50 hosts, then 20 hosts. The first gets .0/26. What network address starts the second subnet?`,a:[`192.168.${third}.64`,`192.168.${third}.64/27`],why:'The /26 uses .0–.63. The next available /27 begins at .64 and supports 30 usable hosts.'});
  const last=pick([300,450,600,750,900,1200]);
  Object.assign(set[5],{q:`TCP has received all bytes 1 through ${last} in order. What acknowledgment number does it send?`,a:[String(last+1),`ack ${last+1}`,`ack${last+1}`],why:`The acknowledgment identifies the next byte expected: ${last+1}.`});
  const size=pick([50,100,150,200]);
  Object.assign(set[6],{q:`TCP receives bytes 1–${size} and ${size*2+1}–${size*3}, but bytes ${size+1}–${size*2} are missing. What acknowledgment number does it send?`,a:[String(size+1),`ack ${size+1}`,`ack${size+1}`],why:`The first missing byte is ${size+1}. Later bytes do not move the cumulative acknowledgment past the gap.`});
  return set;
}
function currentStudyQuestion(s=learning.session) {
  return s.kind==='practice'?byId[s.queue[s.current]]:(s.challenges||CHALLENGES).find(q=>q.id===s.queue[s.current]);
}
if (state?.finished && grade(state).score === TOTAL) learning.aced = true;
function saveLearning() {
  try { localStorage.setItem(LEARNING_KEY, JSON.stringify(learning)); }
  catch { announce('Learning progress is available in this tab only. Browser storage is unavailable.'); }
}
function learningStatus() {
  if (learning.passedAt) return Date.now() - learning.passedAt >= 86400000 ? 'Retention review due' : 'Application check passed · Review tomorrow';
  return learning.aced ? 'Quiz aced · Application check unlocked' : 'Build understanding · Then aim for 60/60';
}
function learningPanel() {
  const missed = state?.finished ? grade(state).missed.length : 0;
  return `<section class="learning-panel" aria-label="Your learning path"><span class="eyebrow">BEYOND THE SCORE</span><h2>Make it stick.</h2><p>A perfect quiz is the first milestone. Practice explanations, solve scenarios without answer choices, then revisit them after a day.</p><ol class="learning-steps"><li><strong>01 · Understand</strong><span>Get feedback and revisit each practice concept until you answer it correctly twice.</span></li><li><strong>02 · Apply</strong><span>Ace the quiz to unlock 15 typed-answer scenarios across chapters 5–7.</span></li><li><strong>03 · Retain</strong><span>Pass all 15 scenarios, then return after 24 hours for another check.</span></li></ol><p class="learning-status" role="status">${learningStatus()}</p><div class="hero-actions"><button class="primary" data-learn="practice">${missed ? `Practice ${missed} missed concepts` : 'Practice with feedback'}</button>${learning.session ? '<button class="secondary" data-learn="resume">Resume study session</button>' : ''}<button class="secondary" data-learn="challenge" ${learning.aced ? '' : 'disabled'}>${learning.passedAt ? 'Take retention review' : 'Try application check'}</button></div><p class="hero-note">Progress stays in this browser. These checks measure practice performance; use a new problem to test transfer.</p></section>`;
}
const previousHome = home, previousResults = results, previousBind = bind, previousRender = render, previousFinish = finish;
home = function() { return previousHome() + learningPanel(); };
results = function() {
  const marker='<div class="section-line"><h2';
  return previousResults().replace(marker,learningPanel()+marker);
};
finish = async function() { await previousFinish(); if (state?.finished && grade(state).score === TOTAL) { learning.aced=true; saveLearning(); render(); } };
bind = function() {
  previousBind();
  app.querySelectorAll('[data-learn]').forEach(b => b.onclick=()=>learningAction(b.dataset.learn));
  app.querySelector('#studyForm')?.addEventListener('submit', checkStudy);
};
render = function(focus=false) {
  if (screen !== 'study') return previousRender(focus);
  app.innerHTML = studyView(); bind();
  if (focus) { app.querySelector('h1').focus({preventScroll:true}); window.scrollTo({top:0,behavior:'instant'}); }
};
async function learningAction(action) {
  if (action==='home') { screen=state?.finished?'results':'home'; render(true); return; }
  if (action==='resume' && learning.session) { screen='study'; render(true); return; }
  if (action==='next') {
    const s=learning.session;
    if (!s?.feedback) return;
    if (s.kind==='practice') {
      const id=s.queue[s.current];
      s.streaks[id]=s.feedback.ok ? (s.streaks[id]||0)+1 : 0;
      if (s.streaks[id]<2) s.queue.push(id);
    }
    s.current++; s.feedback=null; s.optionOrder=null;
    if (s.current===s.queue.length) {
      learning.last={kind:s.kind,correct:s.correct,total:s.current,missed:[...new Set(s.missed)],at:Date.now()};
      if (s.kind==='challenge' && s.correct===s.queue.length) learning.passedAt=Date.now();
      learning.session=null;
    }
    saveLearning(); render(true); return;
  }
  if (!['practice','challenge'].includes(action) || action==='challenge'&&!learning.aced) return;
  if (learning.session && !await confirmAction('Replace your study session?','Your quiz answers are saved separately. Starting this session replaces your unfinished study practice.','Start session')) return;
  const missed=state?.finished ? grade(state).missed : [];
  const pool=action==='practice' ? (missed.length?missed:QUESTIONS) : makeChallengeSet();
  learning.session={kind:action,queue:shuffle(pool.map(q=>q.id)),current:0,correct:0,missed:[],streaks:{},feedback:null,challenges:action==='challenge'?pool:null};
  screen='study'; saveLearning(); render(true);
}
function studyView() {
  const s=learning.session;
  if (!s) {
    const r=learning.last, passed=r?.kind==='challenge'&&r.correct===r.total;
    return `<section class="study-shell"><span class="eyebrow">SESSION COMPLETE</span><h1 tabindex="-1">${r?.kind==='practice'?'Practice complete.':passed?'Application check passed.':'Keep building connections.'}</h1><p>${r?.kind==='practice'?'Each concept in this session was answered correctly twice in a row.':`${r?.correct||0} / ${r?.total||15} scenarios correct on the first submission. ${passed?'Return after 24 hours to check retention.':'Review the feedback and try again when ready.'}`}</p><p>${learningStatus()}</p><div class="hero-actions"><button class="primary" data-learn="home">Back to learning path</button><button class="secondary" data-learn="${r?.kind||'practice'}">Practice again</button></div></section>`;
  }
  const q=currentStudyQuestion(s);
  const f=s.feedback, practice=s.kind==='practice';
  const remaining=s.queue.length-s.current;
  if(practice&&!s.optionOrder){s.optionOrder=shuffle([0,1,2,3]);saveLearning();}
  return `<section class="study-shell"><div class="section-line"><span class="eyebrow">${practice?'GUIDED PRACTICE':'APPLICATION CHECK'} / CHAPTER ${q.chapter}</span><button class="text-button" data-learn="home">Save & exit</button></div><h1 tabindex="-1">${practice?'Understand the connection.':'Recall it. Apply it.'}</h1><p>${practice?`${remaining} checks remaining · Correct twice in a row to clear a concept. Missed concepts return later.`:`Scenario ${s.current+1} of ${s.queue.length} · No answer choices · First submission counts.`}</p><article class="question-card"><h2 id="studyQuestion">${esc(q.q)}</h2><form id="studyForm">${practice?`<div class="options" role="radiogroup" aria-labelledby="studyQuestion">${s.optionOrder.map(i=>`<label class="option ${f&&f.selected===i?'selected':''}"><input type="radio" name="studyAnswer" value="${i}" required ${f?'disabled':''} ${f&&f.selected===i?'checked':''}><span class="option-text">${esc(q.options[i])}</span></label>`).join('')}</div>`:`<label for="recallAnswer">Your answer</label><input class="recall-input" id="recallAnswer" name="studyAnswer" autocomplete="off" required maxlength="160" value="${esc(f?.selected||'')}" ${f?'disabled':''}><p class="hero-note">Use a number, protocol name, or short term as requested. No full sentence needed.</p>`}${!f?'<button class="primary study-submit" type="submit">Check answer</button>':''}</form>${f?`<div class="study-feedback ${f.ok?'is-correct':'is-wrong'}" role="status"><strong>${f.ok?'Correct.':'Let’s work through it.'}</strong>${!f.ok?`<p>Expected answer: <b>${esc(practice?q.options[q.answer]:q.a[0])}</b></p>`:''}<p>${esc(practice?q.explanation:q.why)}</p>${practice&&q.sourcePage?`<small>Course PDF · page ${q.sourcePage}</small>`:''}</div><button class="primary study-submit" data-learn="next">${s.current===s.queue.length-1&&(!practice||f.ok&&(s.streaks[q.id]||0)>=1)?'Finish session':'Continue'} →</button>`:''}</article></section>`;
}
function checkStudy(event) {
  event.preventDefault();
  const s=learning.session; if(!s||s.feedback) return;
  const value=new FormData(event.target).get('studyAnswer'); if(value===null||!value.trim()) return;
  const q=currentStudyQuestion(s);
  const normalize=x=>String(x).trim().toLowerCase().replace(/[.!?]+$/,'').replace(/\s+/g,' ');
  const ok=s.kind==='practice'?Number(value)===q.answer:q.a.some(a=>normalize(a)===normalize(value));
  if(ok) s.correct++; else s.missed.push(q.id);
  s.feedback={ok,selected:s.kind==='practice'?Number(value):value};
  saveLearning(); render();
  app.querySelector('.study-feedback').setAttribute('tabindex','-1'); app.querySelector('.study-feedback').focus();
}
saveLearning();
render();

</script>
<!-- mastery-extension:end -->
</body></html>
